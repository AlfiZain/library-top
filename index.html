<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script src="./src/scripts/main.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <main class="main">
      <h1>Book Library</h1>
      <button id="addBookBtn">New Book</button>
      <dialog id="addBookDialog">
        <form id="addBookForm" novalidate>
          <div class="input-group">
            <label for="author"
              >Author <span class="input-required">*</span></label
            >
            <input
              type="text"
              id="author"
              name="author"
              required
              minlength="1"
              maxlength="16" />
            <span class="error-message"></span>
          </div>

          <div class="input-group">
            <label for="title"
              >Title <span class="input-required">*</span></label
            >
            <input
              type="text"
              id="title"
              name="title"
              required
              minlength="1"
              maxlength="100" />
            <span class="error-message"></span>
          </div>

          <div class="input-group">
            <label for="numberOfPages"
              >Number Of Pages <span class="input-required">*</span></label
            >
            <input
              type="number"
              id="numberOfPages"
              name="numberOfPages"
              required
              min="1"
              max="9999" />
            <span class="error-message"></span>
          </div>

          <div class="input-group">
            <label>
              <input type="checkbox" id="isRead" name="isRead" />
              Finished Reading
            </label>
            <span class="error-message"></span>
          </div>

          <menu>
            <button type="button" id="cancelBtn">Cancel</button>
            <button type="submit">Save</button>
          </menu>
        </form>
      </dialog>
      <div class="book-list"></div>
    </main>
  </body>
</html>
